<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}IMPORDYCOM S.A.{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- HEADER -->
    <header class="header-custom text-center py-4 shadow">

        <div class="d-flex justify-content-center align-items-center gap-3 flex-wrap">

            <img
                src="{{ url_for('static', filename='img/logo.png') }}"
                alt="Logo IMPORDYCOM"
                width="80"
                class="img-fluid">

            <h1 class="m-0">
                IMPORDYCOM S.A.
            </h1>

        </div>

        <h2 class="mt-3">
            Importadora y distribuidora de materiales de acero inoxidable
        </h2>

        <h4>
            Desarrollado por: Stalin Mendieta & Lilian Quijije
        </h4>

    </header>

    {% include 'components/navbar.html' %}

    <!-- CONTENIDO DE CADA PÁGINA -->
    <main class="container my-4">

        {% block content %}

        {% endblock %}

    </main>

    {% include 'components/footer.html' %}

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript del proyecto -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
