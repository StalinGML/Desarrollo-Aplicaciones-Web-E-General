<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores - IMPORDYCOM S.A.</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS del proyecto -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- HEADER -->
    <header class="header-custom text-center py-4 shadow">

        <h1>IMPORDYCOM S.A.</h1>

        <h2 class="mt-3">
            Gestión de Proveedores
        </h2>

    </header>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="/">
                IMPORDYCOM S.A.
            </a>

            <a class="btn btn-outline-light" href="/">
                Volver al inicio
            </a>

        </div>

    </nav>

    <!-- CONTENIDO -->
    <main class="container my-5">

        <section>

            <h2 class="text-center mb-4">
                Registro de Proveedores
            </h2>

            <div class="row justify-content-center">

                <div class="col-lg-6">

                    <form class="shadow">

                        <div class="mb-3">

                            <label for="empresa" class="form-label">
                                Nombre de la empresa
                            </label>

                            <input
                                type="text"
                                id="empresa"
                                class="form-control"
                                placeholder="Ingrese el nombre de la empresa">

                        </div>

                        <div class="mb-3">

                            <label for="contacto" class="form-label">
                                Persona de contacto
                            </label>

                            <input
                                type="text"
                                id="contacto"
                                class="form-control"
                                placeholder="Ingrese el nombre del contacto">

                        </div>

                        <div class="mb-3">

                            <label for="correo" class="form-label">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                id="correo"
                                class="form-control"
                                placeholder="Ingrese el correo">

                        </div>

                        <div class="mb-3">

                            <label for="telefono" class="form-label">
                                Teléfono
                            </label>

                            <input
                                type="text"
                                id="telefono"
                                class="form-control"
                                placeholder="Ingrese el teléfono">

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Registrar Proveedor

                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="text-center bg-dark text-white p-3">

        <p class="m-0">
            Elaborado por: Stalin Mendieta & Lilian Quijije |
            Desarrollo de Aplicaciones Web |
            2026
        </p>

    </footer>

</body>

</html>
