<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitud recibida - IMPORDYCOM S.A.</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="header-custom text-center py-4 shadow">

        <h1 class="m-0">
            IMPORDYCOM S.A.
        </h1>

        <h2 class="mt-3">
            Solicitud de cotización
        </h2>

    </header>

    <main class="container my-5">

        <div class="card shadow mx-auto" style="max-width: 700px;">

            <div class="card-body p-5 text-center">

                <div class="alert alert-success">

                    <h2>
                        Solicitud recibida
                    </h2>

                    <p class="mb-0">
                        Los datos fueron enviados correctamente.
                    </p>

                </div>

                <hr>

                <div class="text-start">

                    <p>
                        <strong>Cliente:</strong>
                        {{ nombre }}
                    </p>

                    <p>
                        <strong>Producto:</strong>
                        {{ producto }}
                    </p>

                    <p>
                        <strong>Categoría:</strong>
                        {{ categoria }}
                    </p>

                </div>

                <a href="/" class="btn btn-primary mt-3">
                    Volver al inicio
                </a>

            </div>

        </div>

    </main>

    <footer class="text-center bg-dark text-white p-3">

        <p class="m-0">
            Elaborado por: Stalin Mendieta & Lilian Quijije |
            Desarrollo de Aplicaciones Web |
            2026
        </p>

    </footer>

</body>

</html>
